[pytest]
pythonpath = .
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
markers =
    slow: runs the real MCMC sampler over a simulated cohort (tens of seconds).
        Deselect with -m "not slow" for a fast inner loop; CI runs everything,
        because these are the tests that keep the evaluator honest.
